name: 🚀 Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Chạy CI trước
  ci:
    name: ✅ CI Checks
    uses: ./.github/workflows/ci.yml

  # Build Docker image và push lên Docker Hub
  build-and-push:
    name: 🐳 Build & Push Docker
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🐳 Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./Twitter_Social
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/twitter-social-api:latest
            ${{ secrets.DOCKER_USERNAME }}/twitter-social-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy lên Render
  deploy:
    name: 🚀 Deploy to Render
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger Render Deploy
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Deploy triggered!"
