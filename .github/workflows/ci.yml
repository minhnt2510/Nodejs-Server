name: ✅ CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  backend-ci:
    name: 🔧 Backend – Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Twitter_Social/package-lock.json

      - name: 📦 Install dependencies
        working-directory: Twitter_Social
        run: npm ci

      - name: 🔍 Lint
        working-directory: Twitter_Social
        run: npm run lint
        continue-on-error: true

      - name: 🏗️ Build
        working-directory: Twitter_Social
        run: npm run build

  frontend-ci:
    name: 🎨 Frontend – Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install dependencies
        working-directory: client
        run: npm ci

      - name: 🔍 Lint
        working-directory: client
        run: npm run lint
        continue-on-error: true

      - name: 🏗️ Build
        working-directory: client
        run: npm run build
